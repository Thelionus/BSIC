<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BSIC Bénin - Formulaire</title>
    
    <!-- FONTS -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">

    <style>
        :root {
            --bsic-blue: #002B49;
            --bsic-gold: #E5B65D;
            --bg-grey: #F4F7F6;
            --text-dark: #1A1A1A;
            --input-border: #ccc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body { 
            font-family: 'Roboto', sans-serif; 
            background-color: var(--bg-grey); 
            color: var(--text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 40px;
        }

        /* HEADER */
        header {
            width: 100%;
            background-color: white;
            padding: 15px 0;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 20px;
        }
        
        .logo { 
            font-family: 'Poppins', sans-serif;
            font-weight: 700; 
            color: var(--bsic-blue); 
            font-size: 1.4rem; 
            letter-spacing: 0.5px; 
        }

        /* CARD CONTAINER - RESPONSIVE WIDTH */
        .card-container {
            background-color: white;
            /* Mobile First: Take up almost full width */
            width: 95%; 
            /* Desktop Constraint: Never get wider than 460px */
            max-width: 460px; 
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            margin-top: 10px;
        }

        /* BANNER */
        .card-banner {
            height: 180px; /* Slightly shorter to save vertical space */
            width: 100%;
            background-color: var(--bsic-blue);
            position: relative;
        }
        .card-banner img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: top center;
        }

        /* BODY */
        .card-body { padding: 25px 20px; }

        /* PROGRESS BAR */
        .progress-bar {
            display: flex;
            justify-content: space-between;
            margin-bottom: 25px;
            position: relative;
            padding: 0 2px;
        }
        .progress-bar::before {
            content: ''; position: absolute; top: 10px; left: 5px; right: 5px; height: 2px; background: #EEF1F3; z-index: 0;
        }
        
        .step { position: relative; z-index: 1; }
        
        .step-circle {
            width: 22px; height: 22px; 
            background: white; 
            border: 2px solid #E0E0E0; 
            border-radius: 50%; 
            display: flex; align-items: center; justify-content: center;
            font-size: 0.7rem; color: #BBB; font-weight: 700;
        }

        .step.completed .step-circle { background: var(--bsic-gold); border-color: var(--bsic-gold); color: white; }
        .step.active .step-circle { border-color: var(--bsic-gold); color: var(--bsic-blue); background: #FFF; box-shadow: 0 0 0 3px rgba(229, 182, 93, 0.15); }

        /* TYPOGRAPHY */
        h2 { 
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            color: var(--bsic-blue); 
            margin-bottom: 5px; 
            text-align: center; 
            font-size: 1.4rem; 
        }
        
        p.desc { 
            text-align: center; 
            color: #757575; 
            margin-bottom: 25px; 
            font-size: 0.9rem; 
        }

        .input-group { margin-bottom: 14px; }
        
        label { 
            display: block; 
            font-family: 'Poppins', sans-serif;
            font-size: 0.8rem; 
            margin-bottom: 4px;
            font-weight: 500; 
            color: #555; 
        }
        
        /* 
           UPDATED: SLIMMER INPUTS 
           Target Height: 32px (Reduced from 40px)
        */
        input, select {
            width: 100%; 
            
            /* Specific height set to 32px */
            height: 32px; 
            
            /* Reduced vertical padding to 0, use line-height to center text */
            padding: 0 10px;
            line-height: 30px; 

            border: 1px solid var(--input-border); 
            border-radius: 6px; 
            
            /* Slightly smaller font to fit the 32px box comfortably */
            font-size: 0.9rem; 
            
            font-family: 'Roboto', sans-serif;
            color: #333;
            background-color: #FAFAFA;
            transition: all 0.2s ease-in-out;
        }

        /* Dropdown Arrow Fix */
        select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%23002B49%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
            background-repeat: no-repeat;
            background-position: right 10px center; /* Vertically centered */
            background-size: 8px auto;
        }

        input:focus, select:focus {
            border-color: var(--bsic-gold);
            background-color: white;
            outline: none;
        }

        /* BUTTON */
        .btn-submit {
            width: 100%;
            background-color: var(--bsic-gold);
            color: white; border: none; padding: 12px; border-radius: 6px;
            font-family: 'Poppins', sans-serif;
            font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 15px;
            box-shadow: 0 4px 10px rgba(229, 182, 93, 0.25);
            transition: transform 0.2s;
        }
        .btn-submit:hover { background-color: #dca646; transform: translateY(-1px); }

        /* RESPONSIVE MEDIA QUERY */
        @media (min-width: 600px) {
            /* Styles for Tablet/Desktop */
            body { padding-top: 20px; }
            .card-container { width: 460px; margin-top: 20px; }
        }

        /* FNMG FILES SECTION */
        .fnmg-section {
            margin-top: 18px;
            border-top: 1px solid #EEF1F3;
            padding-top: 15px;
        }

        .fnmg-section-title {
            font-family: 'Poppins', sans-serif;
            font-size: 0.78rem;
            font-weight: 600;
            color: #555;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .fnmg-file-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 6px;
            background-color: #F8FAFC;
            border: 1px solid #E8ECF0;
            margin-bottom: 7px;
            cursor: pointer;
            user-select: none;
            transition: background-color 0.15s;
        }

        .fnmg-file-item:hover {
            background-color: #EEF4FB;
            border-color: #C5D8EC;
        }

        .fnmg-file-icon {
            width: 32px;
            height: 32px;
            background-color: var(--bsic-blue);
            border-radius: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.55rem;
            font-weight: 700;
            color: var(--bsic-gold);
            font-family: 'Poppins', sans-serif;
            letter-spacing: 0.3px;
        }

        .fnmg-file-info {
            flex: 1;
            overflow: hidden;
        }

        .fnmg-file-name {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .fnmg-file-meta {
            font-size: 0.7rem;
            color: #999;
            margin-top: 1px;
        }

        /* CUSTOM CONTEXT MENU */
        #fnmg-context-menu {
            display: none;
            position: fixed;
            z-index: 9999;
            background: white;
            border: 1px solid #DDE3EA;
            border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.12);
            min-width: 200px;
            overflow: hidden;
            font-family: 'Roboto', sans-serif;
        }

        .ctx-menu-header {
            padding: 8px 14px;
            font-size: 0.7rem;
            color: #999;
            font-family: 'Poppins', sans-serif;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.4px;
            border-bottom: 1px solid #F0F0F0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .ctx-menu-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 14px;
            font-size: 0.88rem;
            color: #333;
            cursor: pointer;
            transition: background-color 0.1s;
        }

        .ctx-menu-item:hover {
            background-color: #F4F7FF;
            color: var(--bsic-blue);
        }

        .ctx-menu-item .ctx-icon {
            width: 16px;
            text-align: center;
            font-size: 1rem;
        }

        .ctx-menu-item.primary .ctx-icon { color: var(--bsic-gold); }
        .ctx-menu-item.danger:hover { background-color: #FFF4F4; color: #c0392b; }

        .ctx-menu-separator {
            height: 1px;
            background-color: #F0F0F0;
            margin: 3px 0;
        }

    </style>
</head>
<body>

    <header>
        <div class="logo">BSIC BÉNIN</div>
    </header>

    <div class="card-container">
        
        <div class="card-banner">
            <img src="https://i.postimg.cc/zG7JfcRS/BSIC-BANQUE-TOTEM75-V2-copie-(1).jpg" alt="BSIC Banner">
        </div>

        <div class="card-body">
            
            <div class="progress-bar">
                <div class="step completed"><div class="step-circle">✓</div></div>
                <div class="step active"><div class="step-circle">2</div></div>
                <div class="step"><div class="step-circle">3</div></div>
                <div class="step"><div class="step-circle">4</div></div>
                <div class="step"><div class="step-circle">5</div></div>
                <div class="step"><div class="step-circle">6</div></div>
                <div class="step"><div class="step-circle">7</div></div>
                <div class="step"><div class="step-circle">8</div></div>
            </div>

            <h2>Informations</h2>
            <p class="desc">Veuillez renseigner vos informations.</p>

            <form>
                
                <div class="input-group">
                    <label>Êtes vous clients ?</label>
                    <select>
                        <option>Non, nouveau client</option>
                        <option>Oui, je suis déjà client</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Agence souhaitée</label>
                    <select>
                        <option>Cotonou - Siège</option>
                        <option>Porto-Novo</option>
                        <option>Parakou</option>
                    </select>
                </div>

                <div class="input-group">
                    <label>Prénom</label>
                    <input type="text" placeholder="Ex: Jean">
                </div>

                <div class="input-group">
                    <label>Nom de famille</label>
                    <input type="text" placeholder="Ex: Dupont">
                </div>

                <div class="input-group">
                    <label>Email</label>
                    <input type="email" placeholder="nom@exemple.com">
                </div>

                <div class="input-group">
                    <label>Mobile</label>
                    <input type="tel" placeholder="+229 ...">
                </div>

                <button type="button" class="btn-submit">Suivant</button>
            </form>

            <!-- FNMG FILES SECTION -->
            <div class="fnmg-section">
                <div class="fnmg-section-title">Fichiers FNMG</div>

                <div class="fnmg-file-item" data-filename="Demande_Pret_Auto_BSIC.fnmg" data-created="19 fév. 2026">
                    <div class="fnmg-file-icon">FNMG</div>
                    <div class="fnmg-file-info">
                        <div class="fnmg-file-name">Demande_Pret_Auto_BSIC.fnmg</div>
                        <div class="fnmg-file-meta">Créé le 19 fév. 2026</div>
                    </div>
                </div>

                <div class="fnmg-file-item" data-filename="Demande_Pret_Immobilier_BSIC.fnmg" data-created="18 fév. 2026">
                    <div class="fnmg-file-icon">FNMG</div>
                    <div class="fnmg-file-info">
                        <div class="fnmg-file-name">Demande_Pret_Immobilier_BSIC.fnmg</div>
                        <div class="fnmg-file-meta">Créé le 18 fév. 2026</div>
                    </div>
                </div>

            </div>

        </div>
    </div>

    <!-- CUSTOM CONTEXT MENU -->
    <div id="fnmg-context-menu">
        <div class="ctx-menu-header" id="ctx-menu-filename">fichier.fnmg</div>
        <div class="ctx-menu-item primary" id="ctx-open-fonofone">
            <span class="ctx-icon">▶</span>
            Ouvrir avec Fonofone
        </div>
        <div class="ctx-menu-item" id="ctx-download">
            <span class="ctx-icon">⬇</span>
            Télécharger
        </div>
        <div class="ctx-menu-separator"></div>
        <div class="ctx-menu-item" id="ctx-copy-name">
            <span class="ctx-icon">⎘</span>
            Copier le nom
        </div>
    </div>

    <script>
        const contextMenu = document.getElementById('fnmg-context-menu');
        const ctxFilename = document.getElementById('ctx-menu-filename');
        let activeFile = null;

        // Show context menu on right-click of any FNMG file item
        document.querySelectorAll('.fnmg-file-item').forEach(function(item) {
            item.addEventListener('contextmenu', function(e) {
                e.preventDefault();
                activeFile = item.dataset.filename;

                // Update menu header with file name
                ctxFilename.textContent = activeFile;

                // Position the menu near the cursor, keeping it on screen
                var menuW = 210;
                var menuH = 150;
                var x = e.clientX;
                var y = e.clientY;
                if (x + menuW > window.innerWidth)  x = window.innerWidth - menuW - 8;
                if (y + menuH > window.innerHeight) y = window.innerHeight - menuH - 8;

                contextMenu.style.left = x + 'px';
                contextMenu.style.top  = y + 'px';
                contextMenu.style.display = 'block';
            });
        });

        // Dismiss menu on any click outside
        document.addEventListener('click', function() {
            contextMenu.style.display = 'none';
            activeFile = null;
        });

        // "Open with Fonofone" - launches Fonofone via its custom URL protocol
        document.getElementById('ctx-open-fonofone').addEventListener('click', function() {
            if (!activeFile) return;
            // Fonofone registers "fonofone://" as its protocol handler on the OS.
            // Clicking this link asks the browser to hand the file off to Fonofone.
            window.location.href = 'fonofone://open?file=' + encodeURIComponent(activeFile);
            contextMenu.style.display = 'none';
        });

        // "Download" - triggers a browser download of the file
        document.getElementById('ctx-download').addEventListener('click', function() {
            if (!activeFile) return;
            var a = document.createElement('a');
            a.href = activeFile;          // adjust to actual file URL when available
            a.download = activeFile;
            a.click();
            contextMenu.style.display = 'none';
        });

        // "Copy name" - copies filename to clipboard
        document.getElementById('ctx-copy-name').addEventListener('click', function() {
            if (!activeFile) return;
            navigator.clipboard.writeText(activeFile).catch(function() {
                // Fallback for older browsers
                var tmp = document.createElement('textarea');
                tmp.value = activeFile;
                document.body.appendChild(tmp);
                tmp.select();
                document.execCommand('copy');
                document.body.removeChild(tmp);
            });
            contextMenu.style.display = 'none';
        });
    </script>

</body>
</html>
