<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BNDE — Assistant Self-Service</title>
  <style>
    :root {
      --bnde-blue: #002B49;
      --bnde-gold: #E5B65D;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #f0f4f8;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .chat-container {
      width: 380px;
      max-width: 98vw;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(0,43,73,0.13);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      height: 580px;
    }
    .chat-header {
      background: var(--bnde-blue);
      color: #fff;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .chat-header .avatar {
      width: 40px; height: 40px;
      background: var(--bnde-gold);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 1.1rem; color: var(--bnde-blue);
    }
    .chat-header .info .name { font-weight: 700; font-size: 1rem; }
    .chat-header .info .status { font-size: 0.75rem; opacity: 0.8; }
    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg { display: flex; gap: 8px; align-items: flex-end; }
    .msg.bot { justify-content: flex-start; }
    .msg.user { justify-content: flex-end; }
    .msg-bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.88rem;
      line-height: 1.45;
    }
    .msg.bot .msg-bubble {
      background: #EEF1F3;
      color: var(--bnde-blue);
      border-bottom-left-radius: 4px;
    }
    .msg.user .msg-bubble {
      background: var(--bnde-blue);
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .choices {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 0 16px 12px;
    }
    .choice-btn {
      background: #fff;
      border: 1.5px solid var(--bnde-gold);
      color: var(--bnde-blue);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    .choice-btn:hover {
      background: var(--bnde-gold);
      color: #fff;
    }
    .chat-input-row {
      display: flex;
      border-top: 1px solid #eee;
      padding: 10px 12px;
      gap: 8px;
    }
    .chat-input-row input {
      flex: 1;
      border: 1.5px solid #dde3ea;
      border-radius: 20px;
      padding: 8px 14px;
      font-size: 0.88rem;
      outline: none;
    }
    .chat-input-row input:focus { border-color: var(--bnde-gold); }
    .chat-input-row button {
      background: var(--bnde-gold);
      border: none;
      border-radius: 50%;
      width: 36px; height: 36px;
      cursor: pointer;
      color: #fff;
      font-size: 1rem;
      display: flex; align-items: center; justify-content: center;
    }
  </style>
</head>
<body>
<div class="chat-container">
  <div class="chat-header">
    <div class="avatar">B</div>
    <div class="info">
      <div class="name">Assistant BNDE</div>
      <div class="status">En ligne · Réponse immédiate</div>
    </div>
  </div>

  <div class="chat-messages" id="chatMessages"></div>

  <div class="choices" id="choicesArea"></div>

  <div class="chat-input-row">
    <input type="text" id="userInput" placeholder="Votre réponse…" />
    <button onclick="sendText()">&#9658;</button>
  </div>
</div>

<script>
  // ── Configuration des messages et flux ──────────────────────────────────────

  const AGENCIES = [
    "1. Rivonia",
    "2. ZI Kaolack",
    "3. Parcel",
    "4. Keur Gorgui",
    "5. Thiès",
    "6. Touba",
    "7. Ziguinchor",
    "8. Saint-Louis",
    "9. Ouroussogui",
    "10. Bureau de Pod",
    "11. Al Foutiyou"
  ];

  const FLOW = [
    {
      id: "welcome",
      bot: "Bonjour ! Je suis votre conseiller BNDE. Comment puis-je vous aider aujourd'hui ?",
      choices: ["Ouvrir un compte", "Faire un crédit", "Autre demande"],
      next: "client_check"
    },
    {
      id: "client_check",
      bot: "Déjà client(e) BNDE ?",
      choices: ["Oui", "Non"],
      next: "agency"
    },
    {
      id: "agency",
      bot: "L'agence BNDE la plus pratique pour vous ? (numéro ou nom dans la liste)\n\n" + AGENCIES.join("\n"),
      choices: null,
      next: "done"
    },
    {
      id: "done",
      bot: "Merci ! Un conseiller de votre agence BNDE vous contactera très prochainement.",
      choices: null,
      next: null
    }
  ];

  // ── Moteur du chat ──────────────────────────────────────────────────────────

  let flowIndex = 0;

  function addMsg(text, who) {
    const area = document.getElementById('chatMessages');
    const div = document.createElement('div');
    div.className = 'msg ' + who;
    const bubble = document.createElement('div');
    bubble.className = 'msg-bubble';
    bubble.style.whiteSpace = 'pre-line';
    bubble.textContent = text;
    div.appendChild(bubble);
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
  }

  function showChoices(choices) {
    const area = document.getElementById('choicesArea');
    area.innerHTML = '';
    if (!choices) return;
    choices.forEach(function(c) {
      var btn = document.createElement('button');
      btn.className = 'choice-btn';
      btn.textContent = c;
      btn.onclick = function() { sendChoice(c); };
      area.appendChild(btn);
    });
  }

  function advance() {
    if (flowIndex >= FLOW.length) return;
    var step = FLOW[flowIndex];
    setTimeout(function() {
      addMsg(step.bot, 'bot');
      showChoices(step.choices);
    }, flowIndex === 0 ? 400 : 600);
  }

  function sendChoice(text) {
    document.getElementById('choicesArea').innerHTML = '';
    addMsg(text, 'user');
    flowIndex++;
    advance();
  }

  function sendText() {
    var input = document.getElementById('userInput');
    var val = input.value.trim();
    if (!val) return;
    input.value = '';
    sendChoice(val);
  }

  document.getElementById('userInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') sendText();
  });

  // Démarrage
  advance();
</script>
</body>
</html>
